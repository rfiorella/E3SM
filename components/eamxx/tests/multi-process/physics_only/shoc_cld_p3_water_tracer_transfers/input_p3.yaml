%YAML 1.1
---
driver_options:
  atmosphere_dag_verbosity_level: 5

time_stepping:
  time_step: ${P3_TIME_STEP}
  run_t0: ${RUN_T0}  # YYYY-MM-DD-XXXXX
  number_of_steps: ${NUM_STEPS}

# water_tracer_transfers must run right after P3, with P3's dt: the P3
# exports only hold P3's last call. No SHOC, so no SHOC replay.
eamxx:
  atm_procs_list: [water_tracers, p3, water_tracer_transfers]
  schedule_type: sequential
  water_tracers:
    water_tracers_file: ${WTT_TRACERS_FILE}
  p3:
    max_total_ni: 740.0e3
    do_prescribed_ccn: false
    use_hetfrz_classnuc: false
  water_tracer_transfers:
    water_tracers_file: ${WTT_TRACERS_FILE}
    replay_shoc: false
    # Test only: > 0 replaces the isotopes' alphas (0: off)
    alpha_override: ${WTT_ALPHA_OVERRIDE}

grids_manager:
  type: mesh_free
  geo_data_source: IC_FILE
  grids_names: [physics_gll]
  physics_gll:
    type: point_grid
    aliases: [physics]
    number_of_global_columns:   218
    number_of_vertical_levels:  72

initial_conditions:
  # The name of the file containing the initial conditions for this test.
  filename: ${SCREAM_DATA_DIR}/init/${EAMxx_tests_IC_FILE_72lev}
  surf_evap: 0.0
  precip_liq_surf_mass: 0.0
  precip_ice_surf_mass: 0.0
  # Ocean inputs of water_tracers (it turns them into tracer surface fluxes, applied by SHOC)
  sst: 300.0
  ocnfrac: 1.0
  ocn_ssq: 0.02
  ocn_re: 0.0015
  ocn_ustar: 0.3
  # Set by water_tracers from bulk water (init: ratio)
  wtrc_t_qv: 0.0
  wtrc_t_qc: 0.0
  wtrc_t_qr: 0.0
  wtrc_t_qi: 0.0
  wtrc_half_qv: 0.0
  wtrc_half_qc: 0.0
  wtrc_half_qr: 0.0
  wtrc_half_qi: 0.0
  # Isotope tracers of the isotope runs (tracers_iso.yaml); unused otherwise
  wtrc_hdo_qv: 0.0
  wtrc_hdo_qc: 0.0
  wtrc_hdo_qr: 0.0
  wtrc_hdo_qi: 0.0
  wtrc_o18_qv: 0.0
  wtrc_o18_qc: 0.0
  wtrc_o18_qr: 0.0
  wtrc_o18_qi: 0.0

# The parameters for I/O control
scorpio:
  output_yaml_files: ["${OUT_YAML}"]
...
