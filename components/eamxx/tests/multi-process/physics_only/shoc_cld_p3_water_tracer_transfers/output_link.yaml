%YAML 1.1
---
# What check_water_tracer_transfers.py needs. Slice 0 is the initial state
# (t0 output); every later slice follows one atm step, whose last subcycle
# produced the SHOC and P3 exports.
filename_prefix: ${OUT_PREFIX}
averaging_type: instant
# Tracers and bulk water must agree to roundoff in Real; the default
# single-precision output would add ~1e-7 relative error to every term.
floating_point_precision: real
field_names:
  - qv
  - qc
  - qr
  - qi
  - pseudo_density
  - pseudo_density_dry
  - T_mid
  - precip_liq_surf_mass
  - precip_ice_surf_mass
  - wtrc_t_qv
  - wtrc_t_qc
  - wtrc_t_qr
  - wtrc_t_qi
  - wtrc_t_precip_liq_surf_mass
  - wtrc_t_precip_ice_surf_mass
  - wtrc_t_residual_shoc
  - wtrc_t_residual_p3
  - wtrc_half_qv
  - wtrc_half_qc
  - wtrc_half_qr
  - wtrc_half_qi
  - wtrc_half_precip_liq_surf_mass
  - wtrc_half_precip_ice_surf_mass
  - wtrc_half_residual_shoc
  - wtrc_t_qv_surf_flux
  - surf_evap
  - wtrc_half_residual_p3
  - shoc_water_stages
  - p3_water_entry
  - p3_water_transfers
  - p3_sed_flux
  - water_transfer_stage_T
output_control:
  frequency: 1
  frequency_units: nsteps
...
