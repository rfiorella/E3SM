%YAML 1.1
---
# Uniform ratios: R = 1 must follow bulk water exactly, and every transfer
# preserves R = 0.5. The surface sources (r_ocn, and r_land = r_ocn) have the
# same ratio, or the surface flux would change it.
tracers:
  wtrc_t:    {type: generic, init: ratio, r_ocn: 1, r_init: 1}
  wtrc_half: {type: generic, init: ratio, r_ocn: 0.5, r_init: 0.5}
...
