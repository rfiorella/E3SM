%YAML 1.1
---
# Same fields as output.yaml: with export_water_transfers on, all of them must
# match the default run bit for bit.
filename_prefix: shoc_standalone_water_transfers_bulk_output
averaging_type: instant
fields:
  physics:
    field_names:
      - T_mid
      - cldfrac_liq
      - eddy_diff_mom
      - horiz_winds
      - U
      - V
      - surf_mom_flux
      - surf_mom_flux_U
      - surf_mom_flux_V
      - qv
      - qc
      - sgs_buoy_flux
      - tke
      - inv_qc_relvar
      - pbl_height
      - shoc_T_mid_tend
      - shoc_qv_tend
      - shoc_tke_tend
      - shoc_horiz_winds_tend
      - shoc_sgs_buoy_flux_tend
      - shoc_eddy_diff_mom_tend
      - shoc_qc_tend
      - shoc_cldfrac_liq_tend

output_control:
  frequency: 1
  frequency_units: nsteps
...
