%YAML 1.1
---
driver_options:
  atmosphere_dag_verbosity_level: 5

time_stepping:
  time_step: ${ATM_TIME_STEP}
  run_t0: ${RUN_T0}  # YYYY-MM-DD-XXXXX
  number_of_steps: ${NUM_STEPS}

eamxx:
  atm_procs_list: [water_tracers]
  water_tracers:
    water_tracers_file: ${TRACERS_FILE}

grids_manager:
  type: mesh_free
  grids_names: [physics_gll]
  physics_gll:
    type: point_grid
    aliases: [physics]
    number_of_global_columns:   32
    number_of_vertical_levels:  72

# Constant state with qv < ocn_ssq, so the ocean evaporates (E_ocn > 0), over a half-ocean
# column whose merged evaporation surf_evap (2e-5 kg/m2/s) exceeds E_ocn: the rest is
# evaporation from land and sea ice.
# Tracers start at 0; init: ratio tracers are then set by the process, every
# phase from its bulk phase (qc, qr and qi are nonzero to exercise that).
initial_conditions:
  qv: 0.01
  qc: 1.0e-4
  qr: 2.0e-5
  qi: 3.0e-6
  T_mid: 290.0
  p_mid: 95000.0
  pseudo_density: 1000.0
  sst: 300.0
  ocnfrac: 0.5
  surf_evap: 2.0e-5
  ocn_ssq: 0.02
  ocn_re: 0.0015
  ocn_ustar: 0.3
  wtrc_bp_qv: 0.0
  wtrc_bp_qc: 0.0
  wtrc_bp_qr: 0.0
  wtrc_bp_qi: 0.0
  wtrc_rp_qv: 0.0
  wtrc_rp_qc: 0.0
  wtrc_rp_qr: 0.0
  wtrc_rp_qi: 0.0
  wtrc_rl_qv: 0.0
  wtrc_rl_qc: 0.0
  wtrc_rl_qr: 0.0
  wtrc_rl_qi: 0.0
  wtrc_bf_qv: 0.0
  wtrc_bf_qc: 0.0
  wtrc_bf_qr: 0.0
  wtrc_bf_qi: 0.0
  wtrc_hdo_qv: 0.0
  wtrc_hdo_qc: 0.0
  wtrc_hdo_qr: 0.0
  wtrc_hdo_qi: 0.0
  wtrc_h218o_qv: 0.0
  wtrc_h218o_qc: 0.0
  wtrc_h218o_qr: 0.0
  wtrc_h218o_qi: 0.0

scorpio:
  output_yaml_files: [output_${POSTFIX}.yaml]
...
